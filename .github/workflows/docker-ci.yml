name: Docker

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    validate-compose:
        name: Validate compose files
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Create placeholder prod local env file (validation only)
              run: touch .env.prod.local

            - name: docker compose config (dev override)
              run: docker compose -f docker-compose.yml -f docker-compose.override.yml config -q

            - name: docker compose config (prod)
              env:
                  WEBSERVER_IMAGE: larpm-symfony:local
              run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

    build:
        name: Build image (target=prod)
        runs-on: ubuntu-latest
        needs: validate-compose
        permissions:
            contents: read
            packages: write
        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix=,format=short

            - name: Build image once (all tags)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: prod
                  push: false
                  tags: |
                      larpm-symfony:smoke-test
                      ${{ steps.meta.outputs.tags }}
                  outputs: type=docker,dest=/tmp/larpm-image.tar
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Upload image artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larpm-image
                  path: /tmp/larpm-image.tar
                  retention-days: 1

            - name: Log in to GHCR
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push already-built image
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              run: |
                  docker load -i /tmp/larpm-image.tar

                  tags="${{ steps.meta.outputs.tags }}"
                  for tag in $tags; do
                    docker push "$tag"
                  done

    smoke-test:
        name: Smoke test full stack
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        needs: build
        env:
            WEBSERVER_IMAGE: larpm-symfony:smoke-test
        steps:
            - uses: actions/checkout@v4

            - name: Download image artifact
              uses: actions/download-artifact@v4
              with:
                  name: larpm-image
                  path: /tmp

            - name: Load image
              run: docker load -i /tmp/larpm-image.tar

            - name: Create throwaway prod env files
              run: |
                  cat > .env.prod.local <<'EOF'
                  APP_SECRET=ci-smoke-test-secret-not-real
                  SERVER_NAME=:80
                  DEFAULT_URI=http://localhost
                  CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
                  MYSQL_ROOT_PASSWORD=ci-root-pass
                  MYSQL_DATABASE=larpm_smoke
                  MYSQL_USER=admin
                  MYSQL_PASSWORD=ci-user-pass
                  DATABASE_URL=mysql://admin:ci-user-pass@database:3306/larpm_smoke?serverVersion=8.4
                  JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
                  JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
                  JWT_PASSPHRASE=
                  MAILER_DSN=smtp://mailer:1025
                  EOF

            - name: Start stack
              run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml up -d

            - name: Wait for database healthcheck
              run: |
                  timeout 60s bash -c \
                    'until [ "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml ps database --format json | jq -r ".Health")" = "healthy" ]; do sleep 2; done'

            - name: Create schema from current entity mappings
              run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml exec -T webserver php bin/console doctrine:schema:create --no-interaction

            - name: Curl webserver
              run: |
                  timeout 200s bash -c 'until curl -sv http://localhost:80/ 2>&1 | tee -a /tmp/curl.log; do sleep 2; done' || true
                  docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml ps
                  cat /tmp/curl.log

            - name: Dump logs on failure
              if: failure()
              run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml logs

            - name: Tear down
              if: always()
              run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml down -v
