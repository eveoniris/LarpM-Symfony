nelmio_api_doc:
    documentation:
        info:
            title: LarpManager API
            description: API pour l'application compagnon et les applications tierces. Obtenir un jeton via POST /api/login_check puis l'envoyer dans l'en-tête Authorization (Bearer).
            version: 0.1.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
        paths:
            /api/login_check:
                post:
                    operationId: loginCheck
                    tags: [Authentification]
                    summary: Obtenir un jeton JWT
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username: { type: string, example: joueur@example.com }
                                        password: { type: string }
                    responses:
                        '200':
                            description: Jeton JWT
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401':
                            description: Identifiants invalides
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
