# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # IP réelle du client derrière un reverse proxy / répartiteur de charge.
    # SYMFONY_TRUSTED_PROXIES (liste d'IP/CIDR séparés par des virgules, ou REMOTE_ADDR
    # pour faire confiance au proxy direct) est vide par défaut : aucun changement tant
    # qu'il n'est pas renseigné. Les en-têtes X-Forwarded-* ne sont lus que pour ces proxies.
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
    php_errors:
    form:
        csrf_protection:
            enabled: true
    #log: true

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    # Limiteurs de débit des envois de mail publics (mot de passe oublié, inscription, renvoi de confirmation).
    # Au-delà de la limite, la réponse est celle d'un envoi réussi, sans rien envoyer (comme une IP bloquée).
    rate_limiter:
        forgot_password_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        forgot_password_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        register_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Échange client_id / client_secret de l'API : limite les essais de secret par IP.
        api_client_token_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'

    #esi: true
    #fragments: true

    assets:
        base_path: '/'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Les compteurs persistent entre deux exécutions (pool fichier) et tous les tests partagent 127.0.0.1.
        rate_limiter:
            api_client_token_ip:
                limit: 100
