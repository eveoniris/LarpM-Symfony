framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Tuiles de carte (servies depuis public/img) et blasons (lus par ReligionController) :
        # ~630 Mo / 7 000 fichiers inutilement scannés et hashés par AssetMapper.
        excluded_patterns:
            - '*/assets/img/map/*'
            - '*/assets/img/map_clean/*'
            - '*/assets/img/religions/*'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
