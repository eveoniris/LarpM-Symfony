framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
            Symfony\Component\Notifier\Message\ChatMessage: sync
            Symfony\Component\Notifier\Message\SmsMessage: sync

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# Le DSN d'env peut être fixé par le conteneur Docker (variable réelle, prioritaire sur les .env) :
# on surcharge donc le transport par environnement ici.
when@dev:
    framework:
        messenger:
            transports:
                # Envoi immédiat en dev (Mailpit) sans worker. Pour tester la vraie file : retirer ce bloc
                # puis lancer `php bin/console messenger:consume async -vv`.
                async: 'sync://'

when@test:
    framework:
        messenger:
            transports:
                # File en mémoire : aucune écriture en base, rien à consommer.
                async: 'in-memory://'
