services:
    webserver:
        image: larpm-symfony:dev
        build:
            context: .
            target: dev
            dockerfile: Dockerfile
        ports:
            - "80:80" # HTTP
            - "443:443" # HTTPS
            - "443:443/udp" # HTTP/3
        env_file:
            - .env.dev
            - path: .env.dev.local
              required: false
        volumes:
            - ./:/app # project files
            - app_var:/app/var # cache/logs dans la VM Docker (bien plus rapide que le bind mount Windows)
            - app_vendor:/app/vendor # idem pour vendor/
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro # custom php.ini
            - ./docker/scripts/docker-entrypoint-dev.sh:/usr/local/bin/docker-entrypoint-dev.sh:ro # entrypoint modifiable sans rebuild
            - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zzzz-dev.ini:ro # surcharges OpCache dev
            - caddy_data:/data # Caddy CA + cert storage (persisted across restarts)
        depends_on:
            - mailer

    database:
        env_file:
            - .env.dev
            - path: .env.dev.local
              required: false
        volumes:
            - ./docker/db/data:/var/lib/mysql # persistent data
            - ./docker/db/initData:/docker-entrypoint-initdb.d:ro # auto-init on empty DB

    mailer:
        image: axllent/mailpit:v1.30
        restart: unless-stopped
        ports:
            - "8025:8025"
            - "1025:1025"
        env_file:
            - .env.dev
            - path: .env.dev.local
              required: false
        volumes:
            - ./docker/mailpit:/data # persistent data

volumes:
    caddy_data:
    app_var:
    app_vendor:
