services:
    webserver:
        build:
            context: .
            target: dev
            dockerfile: Dockerfile
        environment:
            SERVER_NAME: ":80, larpmanager.test"
        volumes:
            - ./:/app
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro # custom php.ini

    database:
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: larpm
            MYSQL_USER: admin
            MYSQL_PASSWORD: password
        volumes:
            - ./docker/db/initData:/docker-entrypoint-initdb.d:ro # bootstrap .sql files on first start
            - ./docker/db/data:/var/lib/mysql:rw # persistent data

    mailer:
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATA_FILE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        volumes:
            - ./docker/mailpit:/data
