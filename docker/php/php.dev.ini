; Surcharges dev uniquement (non copié dans l'image prod).
; Le bind mount Windows rend chaque stat() coûteux : on revalide moins souvent.
[opcache]
opcache.revalidate_freq = 2
; Les commandes console (cache:warmup, migrations...) profitent aussi d'OPcache
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
