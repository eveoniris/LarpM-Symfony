services:
    webserver:
        restart: unless-stopped
        ports:
            - "80:80" # HTTP
        env_file:
            - .env
        depends_on:
            database:
                condition: service_healthy

    database:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - "30202:3306"
        env_file:
            - .env
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER:-admin} -p$${MYSQL_PASSWORD:-password}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

